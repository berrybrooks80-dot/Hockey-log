<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경희중 아이스하키부 훈련일지</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#AF1E2D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하키일지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#AF1E2D;
  --deep:#711020;
  --ice:#EDF1F5;
  --paper:#FFFFFF;
  --ink:#16181C;
  --mute:#67707C;
  --line:#D8DEE5;
  --rink-blue:#1B5EC2;
  --rink-red:#C22B3D;
  --radius:14px;
  --shadow:0 1px 2px rgba(22,24,28,.06),0 6px 18px rgba(22,24,28,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:linear-gradient(160deg,#23262b 0%,#3a2027 55%,#23262b 100%);
  color:var(--ink);
  min-height:100dvh;
  display:flex;justify-content:center;
}
.app{
  width:min(480px,100%);
  background:var(--ice);
  min-height:100dvh;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.45);
  display:flex;flex-direction:column;
}
/* ── app bar ─────────────────────────── */
.appbar{
  position:sticky;top:0;z-index:30;
  background:var(--crimson);
  color:#fff;
  padding:14px 18px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 2px 10px rgba(113,16,32,.35);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.seal{
  flex:0 0 auto;width:44px;height:auto;display:block;
  box-shadow:0 2px 6px rgba(0,0,0,.28);
}
.seal.small{width:32px;border-radius:5px;box-shadow:none}
.brand-txt{min-width:0}
.eyebrow{
  font-family:'Oswald',sans-serif;font-weight:500;font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;opacity:.85;
  display:block;white-space:nowrap;
}
.brand-txt h1{
  font-family:'Black Han Sans',sans-serif;font-weight:400;
  font-size:22px;letter-spacing:.02em;line-height:1.15;white-space:nowrap;
}
.stat{
  text-align:right;flex:0 0 auto;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  border-radius:10px;padding:6px 12px;
}
.stat b{font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;display:block;line-height:1}
.stat span{font-size:10px;opacity:.85;letter-spacing:.08em}
/* ── main ────────────────────────────── */
main{flex:1;padding:18px 16px 96px}
section[hidden]{display:none}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.list-head h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:19px}
h2 .cnt{font-family:'Oswald',sans-serif;color:var(--crimson);font-weight:600;font-size:16px;margin-left:6px}
/* buttons */
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2.5px solid var(--crimson);outline-offset:2px;border-radius:4px}
.btn-primary{
  background:var(--crimson);color:#fff;
  font-weight:700;font-size:13.5px;
  padding:9px 16px;border-radius:999px;
  box-shadow:0 3px 10px rgba(175,30,45,.35);
  transition:transform .12s ease,background .12s ease;
}
.btn-primary:active{transform:scale(.96);background:var(--deep)}
.btn-ghost{
  font-weight:500;font-size:13px;color:var(--mute);
  padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
}
.btn-ghost:active{transform:scale(.96)}
.btn-ghost.danger{color:var(--crimson);border-color:#E5BFC4}
/* log cards */
#log-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.log-card{
  background:var(--paper);border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:15px 16px 13px;
  border-left:5px solid var(--crimson);
  cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease;
  position:relative;
  animation:rise .3s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.log-card:active{transform:scale(.985)}
.log-date{
  font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;line-height:1;
  color:var(--ink);letter-spacing:.02em;
}
.log-date .dow{font-size:13px;color:var(--crimson);margin-left:6px;font-family:'Noto Sans KR';font-weight:700}
.log-title{font-weight:700;font-size:15px;margin-top:6px}
.log-focus{
  font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.log-meta{
  display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;
}
.chip{
  font-size:10.5px;font-weight:700;color:var(--crimson);
  background:#FAECEE;border-radius:999px;padding:3px 9px;letter-spacing:.02em;
}
.log-card .seal{
  position:absolute;top:12px;right:14px;width:34px;height:34px;
  transform:rotate(6deg);opacity:.9;
}
/* empty */
.empty{
  border:2px dashed #C6CED7;border-radius:var(--radius);
  padding:36px 20px;text-align:center;color:var(--mute);
  font-size:13.5px;line-height:1.7;margin-top:20px;
}
.empty .seal{margin:0 auto 14px;opacity:.55;transform:rotate(-4deg)}
/* ── editor ──────────────────────────── */
.editor-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--ice) 82%,transparent);
  padding:2px 0 10px;margin-top:-4px;
}
.editor-head .left{display:flex;align-items:center;gap:4px}
.back-ico{font-size:17px;line-height:1;color:var(--mute);padding:4px 8px 4px 0}
.editor-head h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:17px}
.editor-actions{display:flex;gap:8px}
.form-card{
  background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;
}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{
  font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.03em;
  display:flex;align-items:center;gap:5px;
}
.field>span::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--crimson);display:inline-block}
.field input,.field textarea{
  font-family:inherit;font-size:14px;color:var(--ink);
  border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;background:#FBFCFE;
  transition:border-color .12s ease;
}
.field textarea{resize:vertical;line-height:1.6;min-height:70px}
.field input:focus,.field textarea:focus{border-color:var(--crimson);outline:none}
.field-row{display:flex;gap:12px}
.field-row .field{flex:1}
input[type=date]{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.03em}
/* rink cards */
.rink-card{
  background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 14px 16px;margin-bottom:16px;
}
.rink-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.rink-head h3{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:15px;display:flex;align-items:center;gap:7px}
.rink-head h3 .no{
  font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;color:#fff;
  background:var(--crimson);border-radius:6px;padding:2px 7px;letter-spacing:.05em;
}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mode-btn{
  font-size:12px;font-weight:700;color:var(--mute);
  border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--paper);
}
.mode-btn.active{background:var(--crimson);border-color:var(--crimson);color:#fff}
.tool-btn{
  font-size:12px;font-weight:500;color:var(--mute);
  border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--paper);
}
.tool-btn:active{transform:scale(.94)}
.swatches{display:flex;gap:8px;align-items:center;margin:2px 0 10px}
.sw{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid transparent;box-shadow:0 0 0 1.5px var(--line);
  transition:transform .1s ease;
}
.sw.active{border-color:var(--ink);transform:scale(1.12)}
.sw.red{background:var(--crimson)}
.sw.blue{background:var(--rink-blue)}
.swatches .lab{font-size:11px;color:var(--mute);margin-left:2px}
.rink-wrap{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#F7FAFD}
svg.rink{display:block;width:100%;height:auto;touch-action:none}
svg.rink.mode-draw{cursor:crosshair}
svg.rink .board{fill:#F7FAFD;stroke:#23262B;stroke-width:4}
svg.rink .ln{stroke-width:3;fill:none}
svg.rink .ln.blue{stroke:var(--rink-blue)}
svg.rink .ln.red{stroke:var(--rink-red)}
svg.rink .cir{fill:none;stroke:var(--rink-red);stroke-width:2.5}
svg.rink .cdot{fill:var(--rink-red)}
svg.rink .goal{fill:var(--rink-red);opacity:.85}
svg.rink .crease{fill:rgba(194,43,61,.12);stroke:var(--rink-red);stroke-width:2}
svg.rink .stroke{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.token{cursor:grab}
.token text{
  font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;
  fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none;
}
.token .body{stroke:#fff;stroke-width:2}
.token.ours .body{fill:var(--crimson)}
.token.opp .body{fill:#fff;stroke:var(--rink-blue)}
.token.opp text{fill:var(--rink-blue)}
.token.puck .body{fill:#111;stroke:#333;stroke-width:1}
.rink-notes{
  width:100%;margin-top:12px;
  font-family:inherit;font-size:13px;line-height:2;
  border:none;border-top:1.5px solid var(--line);
  background:repeating-linear-gradient(#fff 0 calc(2em - 1px),var(--line) calc(2em - 1px) 2em);
  background-attachment:local;
  padding:0 4px;min-height:calc(2em * 4);resize:vertical;color:var(--ink);
}
.rink-notes:focus{outline:none;border-top-color:var(--crimson)}
.hint{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.6}
/* toast */
.toast{
  position:fixed;left:50%;bottom:100px;z-index:60;
  transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:#fff;
  border-radius:12px;padding:11px 18px;
  font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:9px;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .seal{width:26px;border-radius:5px;animation:stamp .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(1.7) rotate(9deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
/* tab bar */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(480px,100%);z-index:40;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:8px 26px calc(8px + env(safe-area-inset-bottom));
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.05em;
  padding:4px 10px;border-radius:10px;
}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--crimson)}
.fab{
  width:54px;height:54px;border-radius:50%;
  background:var(--crimson);color:#fff;
  font-size:28px;font-weight:400;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transform:translateY(-20px);
  box-shadow:0 6px 18px rgba(175,30,45,.45),0 0 0 5px var(--ice);
  transition:transform .12s ease;
}
.fab:active{transform:translateY(-20px) scale(.93)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand">
      <img class="seal" data-seal alt="慶熙 도장">
      <div class="brand-txt">
        <span class="eyebrow">Kyunghee MS · Ice Hockey</span>
        <h1>훈련일지</h1>
      </div>
    </div>
    <div class="stat"><b id="stat-total">0</b><span>누적 훈련</span></div>
  </header>

  <main>
    <!-- 목록 -->
    <section id="view-list">
      <div class="list-head">
        <h2>훈련 기록<span class="cnt" id="list-cnt"></span></h2>
      </div>
      <ul id="log-list"></ul>
      <div id="empty" class="empty" hidden>
        <img class="seal small" data-seal style="position:static;transform:rotate(-4deg)" alt="">
        아직 기록이 없습니다.<br>아래 <b>＋</b> 버튼으로 첫 훈련일지를 남겨 보세요.
      </div>
    </section>

    <!-- 작성 -->
    <section id="view-editor" hidden>
      <div class="editor-head">
        <div class="left">
          <button class="back-ico" id="btn-back" aria-label="목록으로">←</button>
          <h2 id="editor-title">새 훈련일지</h2>
        </div>
        <div class="editor-actions">
          <button class="btn-ghost danger" id="btn-delete">삭제</button>
          <button class="btn-primary" id="btn-save">저장</button>
        </div>
      </div>

      <div class="form-card">
        <div class="field-row">
          <div class="field">
            <span>날짜</span>
            <input type="date" id="f-date">
          </div>
        </div>
        <div class="field">
          <span>훈련 제목</span>
          <input id="f-title" maxlength="60" placeholder="예) 주말 스크림 대비 존 엔트리 훈련">
        </div>
        <div class="field">
          <span>오늘의 포인트</span>
          <textarea id="f-focus" rows="3" placeholder="코치 하이라이트 · 집중 목표 · 컨디션 메모 (종이 일지 상단 메모란)"></textarea>
        </div>
      </div>

      <div id="rinks"></div>

      <p class="hint">선수 자석(빨강 = 우리 팀, 파랑 X = 상대, 검정 = 퍽)은 손으로 끌어서 배치하고, <b>그리기</b> 모드에서는 패스·이동 동선을 손으로 그릴 수 있습니다.</p>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" id="tab-list">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>목록
    </button>
    <button class="fab" id="fab-new" aria-label="새 일지 작성">＋</button>
    <button class="tab" id="tab-last">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>최근
    </button>
  </nav>

  <div class="toast" id="toast" role="status"><img class="seal" data-seal alt=""><span id="toast-msg"></span></div>
</div>

  s.appendChild(el('rect',{'class':'goal',x:129,y:472,width:42,height:8,rx:2}));

function RinkController(card){
  var svg=card.querySelector('svg.rink');
  var notes=card.querySelector('.rink-notes');
  var gStrokes=svg.querySelector('.strokes');
  var live=svg.querySelector('.strokes path');
  var gTokens=svg.querySelector('.tokens');
  var mode='move',color='#AF1E2D';
  var tokens=[],strokes=[],drawing=false,pts=null,dragTok=null;
  var self=this;

  function buildTokens(list){
    gTokens.innerHTML='';tokens=[];
    (list&&list.length?list:TOKEN_DEFS).forEach(function(d){
      var r=d.type==='puck'?6:12;
      var g=el('g',{'class':'token '+d.type,transform:'translate('+d.x+','+d.y+')'});
      g.appendChild(el('circle',{'class':'body',r:r}));
      if(d.type!=='puck'){var t=el('text',{});t.textContent=d.label;g.appendChild(t);}
      gTokens.appendChild(g);
      tokens.push({id:d.id,type:d.type,label:d.label,el:g,x:d.x,y:d.y});
    });
  }
  function renderStrokes(){
    gStrokes.innerHTML='';gStrokes.appendChild(live);
    strokes.forEach(function(st){
      gStrokes.appendChild(el('polyline',{'class':'stroke',points:st.points,stroke:st.color}));
    });
  }
  function toRink(e){
    var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
    return {x:Math.max(10,Math.min(290,(e.clientX-r.left)/r.width*vb.width)),
            y:Math.max(10,Math.min(550,(e.clientY-r.top)/r.height*vb.height))};
  }
  svg.addEventListener('pointerdown',function(e){
    var p=toRink(e);
    if(mode==='draw'){
      drawing=true;pts=[p];live.setAttribute('stroke',color);
      live.setAttribute('points',p.x+','+p.y);live.setAttribute('visibility','visible');
      svg.setPointerCapture(e.pointerId);e.preventDefault();return;
    }
    var g=e.target.closest?e.target.closest('.token'):null;
    if(!g)return;
    dragTok=tokens.filter(function(t){return t.el===g})[0];
    if(dragTok){svg.setPointerCapture(e.pointerId);e.preventDefault();}
  });
  svg.addEventListener('pointermove',function(e){
    if(mode==='draw'&&drawing){
      var p=toRink(e);pts.push(p);
      var s=pts.map(function(q){return q.x+','+q.y}).join(' ');
      live.setAttribute('points',s);return;
    }
    if(dragTok){
      var q=toRink(e);
      dragTok.x=q.x;dragTok.y=q.y;
      dragTok.el.setAttribute('transform','translate('+q.x+','+q.y+')');
    }
  });
  function endPointer(){
    if(mode==='draw'&&drawing){
      drawing=false;live.setAttribute('visibility','hidden');
      if(pts&&pts.length>1)strokes.push({color:color,points:pts.map(function(q){return q.x+','+q.y}).join(' ')});
      pts=null;renderStrokes();
    }
    dragTok=null;
  }
  svg.addEventListener('pointerup',endPointer);
  svg.addEventListener('pointercancel',endPointer);

  card.querySelectorAll('.mode-btn').forEach(function(b){
    b.addEventListener('click',function(){
      mode=b.dataset.mode;
      card.querySelectorAll('.mode-btn').forEach(function(x){x.classList.toggle('active',x===b)});
      svg.classList.toggle('mode-draw',mode==='draw');
    });
  });
  card.querySelectorAll('.sw').forEach(function(b){
    b.addEventListener('click',function(){
      color=b.dataset.color;
      card.querySelectorAll('.sw').forEach(function(x){x.classList.toggle('active',x===b)});
    });
  });
  card.querySelector('[data-act=undo]').addEventListener('click',function(){strokes.pop();renderStrokes()});
  card.querySelector('[data-act=clear]').addEventListener('click',function(){strokes=[];renderStrokes()});

  buildTokens(null);renderStrokes();
  this.read=function(){
    return {notes:notes.value,
      players:tokens.map(function(t){return {id:t.id,type:t.type,label:t.label,x:Math.round(t.x),y:Math.round(t.y)}}),
      strokes:strokes.map(function(s){return {color:s.color,points:s.points}})};
  };
  this.set=function(d){
    notes.value=d&&d.notes?d.notes:'';
    buildTokens(d&&d.players&&d.players.length?d.players:null);
    strokes=d&&d.strokes?d.strokes.slice():[];
    renderStrokes();
  };
}
var rinkCtrls=[];
var rinksBox=document.getElementById('rinks');
for(var i=0;i<3;i++){var c=makeRinkCard(i);rinksBox.appendChild(c);rinkCtrls.push(new RinkController(c));}

/* ── 화면 전환 ─────────────────────── */
var viewList=document.getElementById('view-list'),viewEditor=document.getElementById('view-editor');
var tabList=document.getElementById('tab-list'),tabLast=document.getElementById('tab-last');
var current=null,entries=[];
function showList(){
  viewEditor.hidden=true;viewList.hidden=false;
  tabList.classList.add('active');tabLast.classList.remove('active');
  renderList();window.scrollTo({top:0});
}
function newEntry(){
  current={id:uid(),date:todayISO(),title:'',focus:'',rinks:[null,null,null],createdAt:Date.now()};
  document.getElementById('editor-title').textContent='새 훈련일지';
  document.getElementById('btn-delete').style.visibility='hidden';
  fillForm(current);viewList.hidden=true;viewEditor.hidden=false;
  tabLast.classList.add('active');tabList.classList.remove('active');
  window.scrollTo({top:0});
}
function openEntry(id){
  var e=entries.filter(function(x){return x.id===id})[0];
  if(!e)return;
  current=JSON.parse(JSON.stringify(e));
  document.getElementById('editor-title').textContent='훈련일지 수정';
  document.getElementById('btn-delete').style.visibility='visible';
  fillForm(current);viewList.hidden=true;viewEditor.hidden=false;
  tabLast.classList.add('active');tabList.classList.remove('active');
  window.scrollTo({top:0});
}
function todayISO(){var d=new Date();var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day}
function fillForm(e){
  document.getElementById('f-date').value=e.date||todayISO();
  document.getElementById('f-title').value=e.title||'';
  document.getElementById('f-focus').value=e.focus||'';
  for(var i=0;i<3;i++)rinkCtrls[i].set(e.rinks&&e.rinks[i]?e.rinks[i]:null);
}
function readForm(){
  current.date=document.getElementById('f-date').value||todayISO();
  current.title=document.getElementById('f-title').value.trim();
  current.focus=document.getElementById('f-focus').value.trim();
  current.rinks=rinkCtrls.map(function(c){return c.read()});
  current.updatedAt=Date.now();
}

/* ── 목록 렌더 ─────────────────────── */
var DOW=['일','월','화','수','목','금','토'];
function fmtDate(iso){
  var p=(iso||'').split('-');if(p.length!==3)return iso||'';
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  return p[0]+'.'+p[1]+'.'+p[2]+' <span class="dow">'+DOW[d.getDay()]+'</span>';
}
function renderList(){
  entries=loadAll().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||b.createdAt-a.createdAt});
  var ul=document.getElementById('log-list');ul.innerHTML='';
  document.getElementById('empty').hidden=entries.length>0;
  document.getElementById('stat-total').textContent=entries.length;
  document.getElementById('list-cnt').textContent=entries.length?' '+entries.length:'';
  entries.forEach(function(e){
    var strokeN=(e.rinks||[]).reduce(function(n,r){return n+(r&&r.strokes?r.strokes.length:0)},0);
    var noteN=(e.rinks||[]).filter(function(r){return r&&r.notes&&r.notes.trim()}).length;
    var li=document.createElement('li');li.className='log-card';
    li.innerHTML=
      '<img class="seal small" src="'+SEAL_SRC+'" alt="">'+
      '<div class="log-date">'+fmtDate(e.date)+'</div>'+
      '<div class="log-title">'+esc(e.title||'무제 훈련')+'</div>'+
      (e.focus?'<div class="log-focus">'+esc(e.focus)+'</div>':'')+
      '<div class="log-meta">'+
        '<span class="chip">전술 라인 '+strokeN+'</span>'+
        '<span class="chip">링크 메모 '+noteN+'/3</span>'+
      '</div>';
    li.addEventListener('click',function(){openEntry(e.id)});
    ul.appendChild(li);
  });
}

/* ── 저장/삭제/토스트 ───────────────── */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},2200);
}
document.getElementById('btn-save').addEventListener('click',function(){
  readForm();
  var all=loadAll().filter(function(x){return x.id!==current.id});
  all.push(current);saveAll(all);
  toast('도장 쾅! 저장되었습니다');
  showList();
});
document.getElementById('btn-delete').addEventListener('click',function(){
  if(!confirm('이 훈련일지를 삭제할까요? 되돌릴 수 없습니다.'))return;
  saveAll(loadAll().filter(function(x){return x.id!==current.id}));
  toast('삭제했습니다');showList();
});
document.getElementById('btn-back').addEventListener('click',showList);
document.getElementById('fab-new').addEventListener('click',newEntry);
tabList.addEventListener('click',showList);
tabLast.addEventListener('click',function(){
  entries=loadAll().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||b.createdAt-a.createdAt});
  if(entries.length)openEntry(entries[0].id);
  else{toast('저장된 일지가 아직 없어요');showList();}
});

showList();
if(location.hash==='#new')newEntry();
</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
}
</script>
